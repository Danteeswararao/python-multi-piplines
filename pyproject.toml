[tool.poetry]
name = "helloworld-webapp"
version = "0.1.0"
description = "A simple Hello World web application"
authors = ["Developer <dev@example.com>"]
readme = "README.md"
packages = [{include = "helloworld"}]

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
flask = "^2.3.0"
gunicorn = "^21.2.0"
flake8 = "^6.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-flask = "^1.2.0"
black = "^23.7.0"
flake8 = "^6.0.0"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=helloworld --cov-report=xml --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.coverage.run]
source = ["helloworld"]
omit = ["tests/*"]
