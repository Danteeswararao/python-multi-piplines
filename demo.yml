# YAML Demo File - Showcasing Various Syntax Features

# Basic key-value pairs
name: "John Doe"
age: 30
active: true
balance: 1234.56
port: 80
# Strings (different ways to define them)
description: This is a simple string
quoted_string: "This is a quoted string"
multiline_string: |
  This is a multiline string
  that preserves line breaks
  and formatting.

folded_string: >
  This is a folded string
  that will be converted to
  a single line with spaces.

# Lists/Arrays
fruits: &001
  - apple
  - banana
  - orange
  - grape
  - mango
# Inline list syntax
colors: [red, green, blue, yellow]
#
# Nested objects/dictionaries
person:
  name: "Jane Smith"
  contact:
    email: "jane@example.com"
    phone: "+1-555-0123"
  address:
    street: "123 Main St"
    city: "Anytown"
    state: "CA"
    zip: "12345"

new_fruit: *001
# List of objects
employees:
  - name: "Alice Johnson"
    department: "Engineering"
    salary: 75000
  - name: "Bob Wilson"
    department: "Marketing"
    salary: 65000
  - name: "Carol Davis"
    department: "HR"
    salary: 60000

# Mixed data types
config:
  debug: false
  max_connections: 100
  timeout: 30.5
  allowed_hosts:
    - "localhost"
    - "127.0.0.1"
    - "*.example.com"

# Null values
empty_value: null
another_empty: ~

# Environment-like configuration
database:
  host: "localhost"
  port: 5432
  name: "myapp_db"
  credentials:
    username: "dbuser"
    password: "secretpass"

# Feature flags
features:
  new_ui: true
  beta_features: false
  experimental_mode: null

# Timestamps and dates
created_at: 2023-12-01T10:30:00Z
updated_at: !!timestamp 2023-12-01 10:30:00

# Multi-document YAML (separated by ---)
---
document_type: "configuration"
version: "1.0"
settings:
  theme: "dark"
  language: "en"
